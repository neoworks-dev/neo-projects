[package]
name = "neoworks-projects"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Neoworks Projects: the window"

[dependencies]
np-core = { path = "../core" }
serde_json = "1"
svelte_gpui_host = { path = "../../../svelte-gpui/host" }
svelte-gpui-editor = { path = "../../../svelte-gpui/packages/svelte-gpui-editor/view" }
rusqlite = { version = "0.32", features = ["bundled"] }
rquickjs = "0.14.0"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
imagesize = "0.13"
